# docker compose -f deploy/docker-compose.yml up -d     (build context is the kit folder)
services:
  agent:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    ports: ["127.0.0.1:8787:8787"]   # put HTTPS (a reverse proxy or tunnel) in front
    env_file: ../.env                # SV_EVENT_SECRET, TWILIO_*, SLACK_*, ... (never commit this file)
    volumes: ["../:/data"]           # agent.json, workflows.json, pack/, state/
